name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate-a-static:
    name: Gate A / repository static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install pinned metadata validator
        run: python -m pip install --disable-pip-version-check cffconvert==2.0.0
      - name: Install checksummed static tools
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          actionlint_archive="${RUNNER_TEMP}/actionlint.tar.gz"
          gitleaks_archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "${actionlint_archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${actionlint_archive}" | sha256sum --check
          tar --extract --gzip --file "${actionlint_archive}" --directory "${RUNNER_TEMP}" actionlint
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${gitleaks_archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${gitleaks_archive}" | sha256sum --check
          tar --extract --gzip --file "${gitleaks_archive}" --directory "${RUNNER_TEMP}" gitleaks
      - name: Validate GitHub Actions workflows
        run: |
          "${RUNNER_TEMP}/actionlint" -color
      - name: Validate Compose and Bash syntax
        run: |
          docker compose --file docker/compose.yaml config --quiet
          bash -n examples/run_container_verification.sh
      - name: Validate citation metadata
        run: cffconvert --validate
      - name: Validate repository-local Markdown links
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path.cwd().resolve()
          ignored_parts = {
              ".git",
              ".mypy_cache",
              ".nox",
              ".pytest_cache",
              ".ruff_cache",
              ".tox",
              ".venv",
              "build",
              "dist",
              "htmlcov",
          }
          link_pattern = re.compile(r"(?<!!)\[[^]]+\]\((<[^>]+>|[^\s)]+)")
          failures: list[str] = []

          for markdown_path in sorted(root.rglob("*.md")):
              if ignored_parts.intersection(markdown_path.relative_to(root).parts):
                  continue
              text = markdown_path.read_text(encoding="utf-8")
              for match in link_pattern.finditer(text):
                  raw_target = match.group(1).strip("<>")
                  parsed = urlsplit(raw_target)
                  if parsed.scheme or parsed.netloc or raw_target.startswith("#"):
                      continue
                  relative_target = unquote(parsed.path)
                  if not relative_target:
                      continue
                  resolved = (markdown_path.parent / relative_target).resolve()
                  try:
                      resolved.relative_to(root)
                  except ValueError:
                      failures.append(
                          f"{markdown_path.relative_to(root)}: target leaves repository: {raw_target}"
                      )
                      continue
                  if not resolved.exists():
                      failures.append(
                          f"{markdown_path.relative_to(root)}: missing target: {raw_target}"
                      )

          if failures:
              raise SystemExit("\n".join(failures))
          print("repository-local Markdown links resolve")
          PY
      - name: Scan committed history and working tree for secrets
        run: |
          "${RUNNER_TEMP}/gitleaks" git --no-banner --no-color --redact .
          "${RUNNER_TEMP}/gitleaks" dir --no-banner --no-color --redact .

  pure-python:
    name: Pure Python / ${{ matrix.python-version }}
    needs: gate-a-static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check -e ".[test]"
          python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test pure paths
        run: >-
          python -m pytest -p no:cacheprovider -W error
          -m "not heavy and not mpi"
          --cov=scatter3d --cov-report=term-missing

  package-distributions:
    name: Gate A / build and install distributions
    needs: gate-a-static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build==1.2.2.post1
          python -m build
      - name: Verify wheel and source-distribution installs
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip check
          "${RUNNER_TEMP}/wheel-venv/bin/scatter3d" --help
          python -m venv "${RUNNER_TEMP}/sdist-venv"
          "${RUNNER_TEMP}/sdist-venv/bin/python" -m pip install --disable-pip-version-check dist/*.tar.gz
          "${RUNNER_TEMP}/sdist-venv/bin/python" -m pip check
          "${RUNNER_TEMP}/sdist-venv/bin/scatter3d" --help
      - name: Archive distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scatter3d-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  heavy-dolfinx:
    name: Complex DOLFINx heavy tests
    needs: [pure-python, package-distributions]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build pinned image
        run: docker build --pull=false -f docker/Dockerfile -t scatter3d-codex:ci .
      - name: Run heavy tests and reject skips
        run: |
          mkdir -p "${RUNNER_TEMP}/scatter3d-heavy"
          chmod 0777 "${RUNNER_TEMP}/scatter3d-heavy"
          docker run --rm \
            --volume "${RUNNER_TEMP}/scatter3d-heavy:/artifacts" \
            scatter3d-codex:ci bash -euc '
            python3 -m pytest -p no:cacheprovider -W error -m "heavy and not mpi" -ra --junitxml=/tmp/heavy.xml
            python3 - <<"PY"
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/heavy.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          if tests == 0 or skipped:
              raise SystemExit(f"heavy verification invalid: tests={tests}, skipped={skipped}")
          print(f"heavy verification complete: tests={tests}, skipped={skipped}")
          PY
            python3 validation/manufactured_hcurl.py \
              --degrees 1 2 3 \
              --subdivisions 3 4 6 \
              --output /artifacts/manufactured-hcurl.json
            python3 validation/fem_smoke.py \
              --solver direct \
              --degree 3 \
              --subdivisions 2 \
              --frequencies-hz 1.0e8 \
              --output /artifacts/fem-smoke-direct-p3.json
            cp /opt/scatter3d/runtime-metadata.json /artifacts/runtime-metadata.json
          '
      - name: Archive heavy verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scatter3d-heavy-verification
          path: ${{ runner.temp }}/scatter3d-heavy/*.json
          if-no-files-found: error
          retention-days: 30

  mpi:
    name: Two-rank MPI tests
    needs: [pure-python, package-distributions]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build pinned image
        run: docker build --pull=false -f docker/Dockerfile -t scatter3d-codex:ci .
      - name: Run on two ranks and reject skips
        run: |
          mkdir -p "${RUNNER_TEMP}/scatter3d-mpi"
          chmod 0777 "${RUNNER_TEMP}/scatter3d-mpi"
          docker run --rm --ipc=host \
            --volume "${RUNNER_TEMP}/scatter3d-mpi:/artifacts" \
            scatter3d-codex:ci bash -euc '
            mpirun -n 2 sh -euc '\''
              rank="${PMI_RANK:-${OMPI_COMM_WORLD_RANK:-}}"
              test -n "${rank}"
              python3 -m pytest -p no:cacheprovider -W error -m mpi -ra --junitxml="/tmp/mpi-${rank}.xml"
            '\''
            python3 - <<"PY"
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob("/tmp/mpi-*.xml")
          if len(files) != 2:
              raise SystemExit(f"expected two MPI reports, found {files}")
          for path in files:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              tests = sum(int(s.get("tests", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              if tests == 0 or skipped:
                  raise SystemExit(f"MPI verification invalid in {path}: tests={tests}, skipped={skipped}")
          print("MPI verification complete on two ranks with no skips")
          PY
            mpirun -n 2 python3 validation/fem_smoke.py \
              --solver iterative \
              --degree 1 \
              --subdivisions 2 \
              --frequencies-hz 1.0e8 \
              --output /artifacts/fem-smoke-iterative-mpi2.json
            cp /opt/scatter3d/runtime-metadata.json /artifacts/runtime-metadata.json
          '
      - name: Archive MPI verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scatter3d-mpi-verification
          path: ${{ runner.temp }}/scatter3d-mpi/*.json
          if-no-files-found: error
          retention-days: 30
