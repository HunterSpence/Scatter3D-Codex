services:
  scatter3d:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: scatter3d-codex:local
    working_dir: /work
    volumes:
      - ..:/work:ro
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONPATH: /work/src:/usr/local/dolfinx-complex/lib/python3.12/dist-packages:/dolfinx-env/lib/python3.12/site-packages:/usr/local/lib
    command:
      [
        "python3",
        "-m",
        "pytest",
        "-p",
        "no:cacheprovider",
        "-W",
        "error",
        "-m",
        "heavy and not mpi",
        "-ra",
      ]
